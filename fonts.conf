<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 한컴·한양 글꼴 이름을 무료(SIL OFL) 나눔 글꼴로 대신한다: 명조·바탕 계열 -> 나눔명조, 고딕·돋움·굴림 계열 -> 나눔고딕 -->
  <alias binding="same"><family>한컴바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>함초롬바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>휴먼명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>바탕체</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>#중명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>한컴돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>함초롬돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>돋움체</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>굴림체</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>GulimChe</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>DotumChe</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>휴먼고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>한양중고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>-윤고딕330</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>-윤고딕340</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY헤드라인M</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HCI Poppy</family><prefer><family>Liberation Serif</family></prefer></alias>      <!-- 한컴 PDF 에서 영문·숫자가 명조(Times 계열) 모양 -->
  <alias binding="same"><family>나눔고딕 Light</family><prefer><family>NanumGothic</family></prefer></alias>
  <!-- 영문 글꼴: 폭이 같은 무료 글꼴(Liberation = Times New Roman·Arial·Courier New 와 폭 호환, Carlito = Calibri, Caladea = Cambria)로 대신한다. 없으면 폭이 넓은 DejaVu 로 가서 줄이 늘어난다 -->
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <!-- 기호 보충: 나눔·Liberation 에 없는 기호(❑ U+2751, ․ U+2024, ✓ 등)는 DejaVu Sans 가 글자 하나씩 채운다(없으면 상자에 X 가 든 빈 글자표시로 나온다). DejaVu 는 폭이 넓어
       글 본문 글꼴로 뽑히면 줄이 늘어나니, 일반 이름(serif·sans-serif·monospace)과 모르는 이름은 예전처럼 Liberation 으로 고정한다. -->
  <alias binding="same"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
